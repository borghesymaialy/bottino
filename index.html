<script>
/* ================== CONFIG ================== */
const SB_URL = 'https://fxnfaotahrlmmrundkib.supabase.co';

const TAB = 'bottino';
const N_OGGETTI = 15, TIENI = 5, MANO_MAX = 6, MANO_INIZ = 4;

/* ================== DATI ================== */
const SEMI = {
  S:{n:'Sciabole', ic:'⚔', x:'SC', col:'#a32020'},
  D:{n:'Dobloni',  ic:'◉', x:'DB', col:'#a8790a'},
  T:{n:'Teschi',   ic:'☠', x:'TS', col:'#222'},
  N:{n:'Ancore',   ic:'⚓', x:'AN', col:'#1f4466'}
};
const RANK = r => r===1?'A':r===11?'J':r===12?'Q':r===13?'K':String(r);
const CAT = {
  oro:     {n:'Oro',        ic:'🪙', x:'Comm. metalli', nota:'Vale tra 30 e 50, raramente di più'},
  gioielli:{n:'Gioielli',   ic:'💎', x:'Preziosi',      nota:'Da 10 a 90: può essere un affare o una patacca'},
  armi:    {n:'Armi',       ic:'🗡️', x:'Derivati',      nota:'Usala una volta: +5 alla combinazione, ma il suo valore si dimezza'},
  cibo:    {n:'Cibo',       ic:'🍖', x:'Liq. breve',    nota:'Vale poco, ma mangiandolo peschi una carta'},
  rum:     {n:'Rum',        ic:'🥃', x:'Liquidi',       nota:'Il Ricettatore lo valuta il doppio'},
  mappa:   {n:'Mappa',      ic:'🗺️', x:'Private eq.',   nota:'Valore segreto (0-100), si scopre a fine partita'},
  idolo:   {n:'Maledizione',ic:'🗿', x:'Sofferenza',    nota:'Vale -20 e non si può buttare'}
};
const NAVI = {
  spagnola:{n:'galeone spagnolo Santa Catalina', moneta:'dobloni',     p:{oro:4,gioielli:2,armi:2,cibo:3,rum:2,mappa:1,idolo:1}},
  inglese: {n:'mercantile inglese Royal Merchant', moneta:'ghinee',    p:{oro:2,gioielli:2,armi:4,cibo:3,rum:2,mappa:1,idolo:1}},
  olandese:{n:'fluyt olandese Gouden Leeuw', moneta:'fiorini',         p:{oro:2,gioielli:4,armi:2,cibo:3,rum:2,mappa:1,idolo:1}},
  francese:{n:'brigantino francese Belle Étoile', moneta:"luigi d'oro",p:{oro:2,gioielli:3,armi:2,cibo:2,rum:4,mappa:1,idolo:1}}
};
const NOMI = {
  oro: m => ['Sacco di '+m,'Forziere di '+m,"Lingotti d'oro","Calice d'oro","Catena d'oro",'Scrigno di '+m,"Candelabro d'oro"],
  gioielli: () => ['Collana di perle','Anello con rubino','Smeraldi grezzi','Diadema','Spilla di zaffiri','Orecchini di diamante','Croce tempestata','Cofanetto di ametiste'],
  armi: () => ['Pistola a pietra focaia','Sciabola da abbordaggio','Moschetto','Pugnale cerimoniale','Cannoncino girevole',"Ascia d'arrembaggio",'Coppia di pistole'],
  cibo: () => ['Barile di gallette','Prosciutto salato','Cassa di limoni','Forma di formaggio','Sacco di fagioli','Carne secca','Gabbia di galline'],
  rum: () => ['Botte di rum','Bottiglie di rum scuro','Fiasco di grog','Damigiana di rum'],
  mappa: () => ['Mappa del tesoro','Carta nautica segreta'],
  idolo: () => ['Idolo maledetto']
};
const LOTTI = {
  piccolo:{n:1, vis:['seme'],               min:0,  x:'Pacchetto S'},
  medio:  {n:2, vis:['tutto','seme'],       min:20, x:'Pacchetto M'},
  grosso: {n:3, vis:['tutto','nulla','nulla'], min:40, x:'Pacchetto L'}
};
const TAGS = {
  coppia:{g:'Coppia ×2', x:'CPP'}, arrembaggio:{g:'Arrembaggio = 25', x:'ARR'},
  seme:{g:'Stesso seme +5', x:'SEM'}, arma:{g:'Arma +5', x:'GAR'}
};

/* ================== LOGICA PURA ================== */
function rnd(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function nuovoMazzo(){ const m=[]; for(const s of 'SDTN') for(let r=1;r<=13;r++) m.push({s,r}); return m; }
function pesca(s){
  if(!s.mazzo.length){ s.mazzo = shuffle(s.scarti); s.scarti = []; }
  return s.mazzo.pop() || null;
}
function valCarta(c){ return c.r===1 ? 11 : c.r>=11 ? 10 : c.r; }
function punti(c1,c2,arma){
  const tags=[]; let p;
  const fig = r => r>=11;
  if(c1.r===c2.r){ p=(valCarta(c1)+valCarta(c2))*2; tags.push('coppia'); }
  else if((c1.r===1&&fig(c2.r))||(c2.r===1&&fig(c1.r))){ p=25; tags.push('arrembaggio'); }
  else p=valCarta(c1)+valCarta(c2);
  if(c1.s===c2.s){ p+=5; tags.push('seme'); }
  if(arma){ p+=5; tags.push('arma'); }
  return {p, tags};
}
function valoreFinale(o){ return (o.cat==='armi' && o.usata) ? Math.floor(o.valore/2) : o.valore; }
function pagamento(o){
  if(o.cat==='idolo') return null;
  if(o.cat==='mappa') return 30;
  if(o.cat==='rum') return o.valore*2;
  return valoreFinale(o);
}
function pesoRandom(p){
  const tot=Object.values(p).reduce((a,b)=>a+b,0); let x=Math.random()*tot;
  for(const k in p){ x-=p[k]; if(x<0) return k; }
  return 'cibo';
}
function creaOggetto(cat,nave,i){
  let v;
  switch(cat){
    case 'oro': v = Math.random()<0.15 ? rnd(51,65) : rnd(30,50); break;
    case 'gioielli': v = rnd(10,90); break;
    case 'armi': v = rnd(20,40); break;
    case 'cibo': v = rnd(0,10); break;
    case 'rum': v = rnd(5,15); break;
    case 'mappa': v = rnd(0,100); break;
    default: v = -20;
  }
  return {id:'LT'+(101+i), cat, nome:pick(NOMI[cat](NAVI[nave].moneta)), valore:v};
}
function generaCoda(nave){
  const out=[]; let idoli=0, mappe=0;
  while(out.length<N_OGGETTI){
    const c = pesoRandom(NAVI[nave].p);
    if(c==='idolo' && idoli>=1) continue;
    if(c==='mappa' && mappe>=2) continue;
    if(c==='idolo') idoli++;
    if(c==='mappa') mappe++;
    out.push(creaOggetto(c,nave,out.length));
  }
  return out;
}
function nuovoLotto(s,tipo){
  const carte=[]; for(let i=0;i<LOTTI[tipo].n;i++){ const c=pesca(s); if(c) carte.push(c); }
  return {tipo, carte};
}
function vuota(){ return {c1:null, c2:null, arma:null, comprato:false}; }
function addLog(s,g,x){ s.log.unshift({g,x,t:Date.now()}); s.log = s.log.slice(0,40); }
function nome(s,p){ return (s.giocatori[p] && s.giocatori[p].nome) || (p==='A'?'Pirata A':'Pirata B'); }
function altro(p){ return p==='A'?'B':'A'; }

function nuovoStato(giocatori){
  const nave = pick(Object.keys(NAVI));
  const s = {
    fase: giocatori.B ? 'gioco' : 'attesa', nave, coda:generaCoda(nave), turno:0,
    mazzo:shuffle(nuovoMazzo()), scarti:[], mani:{A:[],B:[]}, stive:{A:[],B:[]},
    mare:[], venduti:[], banco:[], giocate:{A:vuota(),B:vuota()}, fase_turno:'prima',
    esito:null, log:[], scelte:{A:null,B:null}, giocatori, risultato:null
  };
  for(let i=0;i<MANO_INIZ;i++){ s.mani.A.push(pesca(s)); s.mani.B.push(pesca(s)); }
  s.banco = ['piccolo','medio','grosso'].map(t=>nuovoLotto(s,t));
  addLog(s, `Abbordato il ${NAVI[nave].n}: ${N_OGGETTI} oggetti da spartire.`,
            `Avvio sessione: ${N_OGGETTI} lotti caricati, controparte ${nave.toUpperCase()}.`);
  return s;
}

// azioni (ritornano false se non valide)
function regolaCompra(s,p,li,itemId){
  const g=s.giocate[p];
  if(s.fase!=='gioco' || g.comprato || g.c2) return false;
  const lot=s.banco[li]; if(!lot) return false;
  const st=s.stive[p]; const k=st.findIndex(o=>o.id===itemId); if(k<0) return false;
  if(st[k].cat==='armi' && g.arma===st[k].id) return false;
  const pv=pagamento(st[k]); if(pv===null || pv<LOTTI[lot.tipo].min) return false;
  const [it]=st.splice(k,1); s.venduti.push(it);
  s.mani[p].push(...lot.carte);
  s.banco[li]=nuovoLotto(s,lot.tipo); g.comprato=true;
  addLog(s, `${nome(s,p)} compra un lotto ${lot.tipo} dal Ricettatore e paga con: ${it.nome}.`,
            `${nome(s,p)}: acquisto ${LOTTI[lot.tipo].x} su desk OTC, regolato con ${it.id} (${CAT[it.cat].x}).`);
  return true;
}
function regolaMangia(s,p,itemId){
  if(s.fase!=='gioco' || s.giocate[p].c2) return false;
  if(s.mani[p].length>=MANO_MAX) return false;
  const st=s.stive[p]; const k=st.findIndex(o=>o.id===itemId && o.cat==='cibo'); if(k<0) return false;
  const [it]=st.splice(k,1); (s.mangiati=s.mangiati||[]).push(it);
  const c=pesca(s); if(c) s.mani[p].push(c);
  addLog(s, `La ciurma di ${nome(s,p)} si mangia: ${it.nome}. +1 carta.`,
            `${nome(s,p)}: liquidazione ${it.id}, +1 ordine disponibile.`);
  return true;
}
function regolaGioca(s,p,idx,armaId){
  if(s.fase!=='gioco') return false;
  const g=s.giocate[p], mano=s.mani[p];
  if(idx==null || idx<0 || idx>=mano.length) return false;
  if(s.fase_turno==='prima'){
    if(g.c1) return false;
    g.c1 = mano.splice(idx,1)[0];
    if(s.giocate[altro(p)].c1) s.fase_turno='seconda';
  } else {
    if(g.c2 || !g.c1) return false;
    if(armaId){
      const a=s.stive[p].find(o=>o.id===armaId && o.cat==='armi' && !o.usata);
      if(!a) return false; g.arma=a.id;
    }
    g.c2 = mano.splice(idx,1)[0];
    if(s.giocate[altro(p)].c2) risolvi(s);
  }
  return true;
}
function risolvi(s){
  const it=s.coda[s.turno], r={};
  for(const p of ['A','B']){
    const g=s.giocate[p];
    const a = g.arma ? s.stive[p].find(o=>o.id===g.arma) : null;
    if(a) a.usata=true;
    const pt=punti(g.c1,g.c2,!!a);
    r[p]={c1:g.c1, c2:g.c2, arma:a?a.nome:null, p:pt.p, tags:pt.tags};
    s.scarti.push(g.c1,g.c2);
  }
  const w = r.A.p>r.B.p ? 'A' : r.B.p>r.A.p ? 'B' : null;
  if(w) s.stive[w].push(it); else s.mare.push(it);
  s.esito={turno:s.turno, item:it, A:r.A, B:r.B, w};
  const vt = it.cat==='mappa' ? '?' : it.valore;
  addLog(s,
    w ? `Oggetto ${s.turno+1}: ${it.nome} (${vt}) va a ${nome(s,w)}, ${r[w].p} contro ${r[altro(w)].p}.`
      : `Oggetto ${s.turno+1}: pareggio a ${r.A.p}, ${it.nome} finisce in mare.`,
    w ? `Asta ${s.turno+1} ${it.id}: rating ${r.A.p}/${r.B.p}, aggiudicato a ${nome(s,w)}.`
      : `Asta ${s.turno+1} ${it.id}: rating ${r.A.p}/${r.B.p}, nessuna aggiudicazione (stralcio).`);
  for(const p of ['A','B']){
    let n=0;
    while(n<2 && s.mani[p].length<MANO_MAX){ const c=pesca(s); if(!c) break; s.mani[p].push(c); n++; }
    while(s.mani[p].length>MANO_MAX){
      let k=0; s.mani[p].forEach((c,i)=>{ if(valCarta(c)<valCarta(s.mani[p][k])) k=i; });
      s.scarti.push(s.mani[p].splice(k,1)[0]);
    }
  }
  s.giocate={A:vuota(),B:vuota()}; s.fase_turno='prima'; s.turno++;
  if(s.turno>=N_OGGETTI){
    s.fase='scelta';
    addLog(s,'Bottino finito! Ognuno sceglie i 5 oggetti da tenere.','Chiusura sessione: selezione posizioni da mantenere.');
  }
}
function regolaScegli(s,p,keep){
  if(s.fase!=='scelta' || s.scelte[p]) return false;
  const st=s.stive[p], need=Math.min(TIENI,st.length);
  if(keep.length!==need || new Set(keep).size!==keep.length) return false;
  for(const id of keep) if(!st.find(o=>o.id===id)) return false;
  for(const o of st) if(o.cat==='idolo' && !keep.includes(o.id)) return false;
  s.scelte[p]=keep;
  if(s.scelte[altro(p)]) chiudi(s);
  return true;
}
function totaleTenuto(s,p){
  return s.stive[p].filter(o=>s.scelte[p].includes(o.id)).reduce((a,o)=>a+valoreFinale(o),0);
}
function chiudi(s){
  const A=totaleTenuto(s,'A'), B=totaleTenuto(s,'B');
  const w = A>B?'A':B>A?'B':null;
  s.risultato={A,B,w}; s.fase='fine';
  addLog(s, w ? `${nome(s,w)} vince la spartizione, ${Math.max(A,B)} a ${Math.min(A,B)}.` : `Pareggio a ${A}: rissa sul ponte.`,
            `Sessione chiusa. Controvalore finale ${A} / ${B}.`);
}

if(typeof document!=='undefined'){

const sb = supabase.createClient(SB_URL, SB_KEY);
const MOBILE = matchMedia('(max-width: 820px), (pointer: coarse)').matches;
let codice=null, ruolo=null, S=null, ver=-1, canale=null, poll=null, occupato=false;

let boss=false, chiaveUi='';
const ui = {sel:null, arma:null, acquisto:null, tieni:null, regole:false, msg:'', codPre:'', ref:'A1', fx:''};

function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v); }catch(e){ return null; } }
function esc(t){ return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function lui(){ return altro(ruolo); }
function toast(t){ ui.msg=t; render(); clearTimeout(toast.t); toast.t=setTimeout(()=>{ ui.msg=''; render(); },3500); }
function errore(e){ console.error(e); toast('Errore: '+(e.message||e)); }
function genCodice(){ const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let c=''; for(let i=0;i<4;i++) c+=a[Math.floor(Math.random()*a.length)]; return c; }
function leggiNome(){
  const el=document.getElementById('nomeIn'); const v=(el?el.value:'').trim().slice(0,20);
  if(!v){ toast('Scrivi prima il tuo nome'); return null; }
  ls('bottino:nome',v); return v;
}

async function crea(){
  const n=leggiNome(); if(!n) return;
  for(let k=0;k<5;k++){
    const c=genCodice();
    const {error}=await sb.from(TAB).insert({codice:c, stato:nuovoStato({A:{nome:n},B:null}), versione:0});
    if(!error){ ls('bottino:'+c,'A'); return apri(c); }
    if(!/duplicate/i.test(error.message)) return errore(error);
  }
}
async function entra(c){
  c=(c||'').trim().toUpperCase();
  if(c.length!==4) return toast('Il codice ha 4 caratteri');
  const {data,error}=await sb.from(TAB).select('stato,versione').eq('codice',c).maybeSingle();
  if(error) return errore(error);
  if(!data) return toast('Stanza non trovata');
  if(!ls('bottino:'+c)){
    const g=data.stato.giocatori;
    const n=leggiNome(); if(!n) return;
    const stesso = p => g[p] && g[p].nome.toLowerCase()===n.toLowerCase();
    if(stesso('A')||stesso('B')){
      // rientro: stesso nome di un giocatore già presente
      ls('bottino:'+c, stesso('A')?'A':'B');
      return apri(c);
    }
    if(g.B) return toast('Stanza già piena');
    codice=c; ruolo='B';
    const ok=await muta(s=>{
      if(s.giocatori.B) return false;
      s.giocatori.B={nome:n}; s.fase='gioco';
      addLog(s,`${n} sale a bordo. Si comincia!`,`Controparte ${n} collegata. Sessione avviata.`);
    });
    if(!ok){ codice=null; ruolo=null; S=null; ver=-1; render(); return toast('Stanza già piena'); }
    ls('bottino:'+c,'B');
  }
  apri(c);
}
async function apri(c){
  codice=c; ruolo=ls('bottino:'+c);
  try{ history.replaceState(null,'','?c='+c); }catch(e){}
  const {data,error}=await sb.from(TAB).select('stato,versione').eq('codice',c).maybeSingle();
  if(error) return errore(error);
  if(!data){ codice=null; return toast('Stanza non trovata'); }
  applica(data,true);
  if(canale) sb.removeChannel(canale);
  canale=sb.channel('bottino-'+c)
    .on('postgres_changes',{event:'*',schema:'public',table:TAB,filter:'codice=eq.'+c},
        p=>{ if(p.new && p.new.stato) applica(p.new); })
    .subscribe();
  clearInterval(poll);
  poll=setInterval(async()=>{
    if(!codice) return;
    const {data}=await sb.from(TAB).select('stato,versione').eq('codice',codice).maybeSingle();
    if(data) applica(data);
  },4000);
}
function esci(){
  codice=null; ruolo=null; S=null; ver=-1; clearInterval(poll);
  if(canale){ sb.removeChannel(canale); canale=null; }
  try{ history.replaceState(null,'',location.pathname); }catch(e){}
  render();
}
function applica(row,forza){
  if(!forza && row.versione<=ver) return;
  ver=row.versione; S=row.stato; render();
}
async function muta(fn){
  for(let t=0;t<4;t++){
    const {data:cur,error:e1}=await sb.from(TAB).select('stato,versione').eq('codice',codice).single();
    if(e1){ errore(e1); return false; }
    const s=JSON.parse(JSON.stringify(cur.stato));
    if(fn(s)===false){ applica(cur); return false; }
    const {data,error}=await sb.from(TAB)
      .update({stato:s, versione:cur.versione+1, aggiornato_il:new Date().toISOString()})
      .eq('codice',codice).eq('versione',cur.versione).select('stato,versione');
    if(error){ errore(error); return false; }
    if(data && data.length){ applica(data[0]); return true; }
  }
  toast('Mossa sovrapposta, riprova'); return false;
}
async function azione(fn,msgKo){
  if(occupato) return; occupato=true;
  try{ const ok=await muta(fn); if(!ok && msgKo) toast(msgKo); return ok; }
  finally{ occupato=false; }
}

function griglia(R,minRighe=40){
  const NC=Math.max(10,...R.map(r=>r.reduce((a,c)=>a+(c.span||1),0)));
  let h=`<table class="xl"><colgroup><col style="width:40px"><col style="width:150px">${'<col style="width:104px">'.repeat(NC-1)}</colgroup>
<thead><tr><th></th>${Array.from({length:NC},(_,i)=>`<th>${colL(i)}</th>`).join('')}</tr></thead><tbody>`;
  const tot=Math.max(minRighe,R.length+8);
  for(let ri=0;ri<tot;ri++){
    const row=R[ri]||[]; let used=0;
    h+=`<tr><th>${ri+1}</th>`;
    for(const c of row){
      const sp=c.span||1, ref=colL(used)+(ri+1);
      h+=`<td class="${c.c}" ${sp>1?`colspan="${sp}"`:''} data-ref="${ref}" ${c.a?`data-a="${c.a}"`:''}>${c.html?c.t:esc(c.t)}</td>`;
      used+=sp;
    }
    for(;used<NC;used++) h+=`<td data-ref="${colL(used)}${ri+1}"></td>`;
    h+='</tr>';
  }
  return h+'</tbody></table>';
}

/* ---------- render e input ---------- */
function render(){
  const app=document.getElementById('app');
  const xl = boss || vista==='foglio';
  document.body.className = xl ? 'vx' : 'vg';
  document.title = boss ? 'Clienti_MiFID_scaduti.xlsx - Excel' : 'Allocazione_Lotti_Q4.xlsx - Excel';
  const nomeV=document.getElementById('nomeIn')?.value, codV=document.getElementById('codIn')?.value;
  if(codV!=null) ui.codPre=codV;
  if(boss){ app.innerHTML=renderBoss(); return; }
  if(!S || !ruolo){
    app.innerHTML = xl ? lobbyX() : lobbyG();
    if(nomeV!=null) document.getElementById('nomeIn').value=nomeV;
  } else {
    aggiornaUi();
    app.innerHTML = xl ? renderFoglio() : renderGioco();
  }
  if(!xl && ui.msg) app.insertAdjacentHTML('beforeend',`<div class="toast">${esc(ui.msg)}</div>`);
}

document.addEventListener('click',e=>{
  const td=e.target.closest('td[data-ref]');
  if(td){ ui.ref=td.dataset.ref; ui.fx=td.textContent; }
  const el=e.target.closest('[data-a]');
  if(!el){ if(td) render(); return; }
  if(el.disabled) return;
  const i=el.dataset.a.indexOf(':');
  const a=i<0?el.dataset.a:el.dataset.a.slice(0,i), v=i<0?null:el.dataset.a.slice(i+1);
  gestisci(a,v);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ boss=!boss; render(); }
  if(e.key==='Enter' && e.target.id==='codIn') entra(e.target.value);
});

function gestisci(a,v){
  const me=ruolo;
  switch(a){
    case 'crea': return crea();
    case 'entra': return entra(document.getElementById('codIn')?.value);
    case 'esci': return esci();
    case 'vista': vista=v; ls('bottino:vista',v); boss=false; return render();
    case 'boss': boss=!boss; return render();
    case 'regole': ui.regole=!ui.regole; return render();
    case 'sel': ui.sel = ui.sel===+v ? null : +v; return render();
    case 'arma': ui.arma = ui.arma===v ? null : v; return render();
    case 'compra': ui.acquisto = ui.acquisto===+v ? null : +v; return render();
    case 'annulla': ui.acquisto=null; return render();
    case 'tieni': {
      const o=S.stive[me].find(x=>x.id===v); if(!o || S.scelte[me]) return;
      if(o.cat==='idolo') return toast("L'idolo maledetto non si può buttare");
      const k=ui.tieni.indexOf(v);
      if(k>=0) ui.tieni.splice(k,1);
      else if(ui.tieni.length<Math.min(TIENI,S.stive[me].length)) ui.tieni.push(v);
      else return toast(`Ne tieni al massimo ${TIENI}: togline uno prima`);
      return render();
    }
    case 'gioca': {
      const idx=ui.sel, arma=ui.arma;
      return azione(s=>regolaGioca(s,me,idx,arma),'Mossa non valida').then(ok=>{ if(ok){ ui.sel=null; ui.arma=null; render(); } });
    }
    case 'paga': {
      const li=ui.acquisto;
      return azione(s=>regolaCompra(s,me,li,v),'Acquisto non riuscito').then(()=>{ ui.acquisto=null; render(); });
    }
    case 'mangia': return azione(s=>regolaMangia(s,me,v),'Non puoi mangiarlo ora');
    case 'conferma': { const keep=[...ui.tieni]; return azione(s=>regolaScegli(s,me,keep),'Scelta non valida'); }
    case 'rivincita': return azione(s=>{
      if(s.fase!=='fine') return false;
      const ns=nuovoStato(s.giocatori); for(const k of Object.keys(s)) delete s[k]; Object.assign(s,ns);
    });
  }
}
